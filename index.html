<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>🎵 音楽理論アシスタント</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f6f8;color:#111827}
header{background:#111827;color:white;padding:20px 16px 16px;position:sticky;top:0;z-index:5}header h1{margin:0 0 5px;font-size:21px}header p{margin:0;font-size:13px;opacity:.8}
main{max-width:900px;margin:auto;padding:14px 14px 90px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000010}
h2{font-size:17px;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap}select,input,button{font:inherit;min-height:44px;border-radius:10px;border:1px solid #cbd5e1;padding:8px 11px}select,input{background:white;flex:1;min-width:180px}button{background:#111827;color:white;border:0;font-weight:700;cursor:pointer}
.result{margin-top:12px}.item{padding:10px 0;border-bottom:1px solid #e5e7eb}.item:last-child{border-bottom:0}.item b{display:inline-block;margin-right:6px}.muted{color:#6b7280;font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;margin:3px;font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:7px env(safe-area-inset-right) calc(7px + env(safe-area-inset-bottom)) env(safe-area-inset-left);z-index:10}
nav button{background:transparent;color:#111827;font-size:11px;padding:5px;min-width:58px}.page{display:none}.page.active{display:block}
.stat{font-size:24px;font-weight:800}.sheet{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.count{font-weight:700;color:#4f46e5}
</style>
</head>
<body>
<header><h1>🎵 音楽理論アシスタント</h1><p>コード・進行・スケール・転調・作曲を1つに</p></header>
<main>
<section id="home" class="page active">
<div class="card"><h2>搭載DB</h2><div class="stat" id="total">読み込み中…</div><div class="muted">元Excelの実データ</div><div id="dbStats" class="result"></div></div>
<div class="card"><h2>🎹 コードを調べる</h2><div class="row"><input id="chordQ" list="chords" placeholder="例：Cmaj7 / Am7 / G7"><datalist id="chords"></datalist><button id="chordBtn">検索</button></div><div id="chordOut" class="result"></div></div>
</section>

<section id="chord" class="page">
<div class="card"><h2>🎹 コード辞典</h2><input id="chordQ2" list="chords2" placeholder="コード名"><datalist id="chords2"></datalist><button id="chordBtn2">表示</button><div id="chordOut2" class="result"></div></div>
<div class="card"><h2>コードスケール</h2><input id="csQ" list="chords3" placeholder="コード名"><datalist id="chords3"></datalist><button id="csBtn">表示</button><div id="csOut" class="result"></div></div>
</section>

<section id="progress" class="page">
<div class="card"><h2>🔄 コード進行</h2><select id="progType"></select><button id="progBtn">候補を見る</button><div id="progOut" class="result"></div></div>
<div class="card"><h2>実コード検索</h2><input id="progQ" placeholder="例：F - G - Em - Am"><button id="progTextBtn">検索</button><div id="progTextOut" class="result"></div></div>
</section>

<section id="scale" class="page">
<div class="card"><h2>🎼 スケール・解決音</h2><div class="row"><select id="scaleKind"><option>メジャー</option><option>マイナー</option></select><select id="scaleKey"></select></div><button id="scaleBtn">表示</button><div id="scaleOut" class="result"></div></div>
</section>

<section id="compose" class="page">
<div class="card"><h2>✍️ 作曲支援</h2><select id="composeType"></select><button id="composeBtn">おすすめを見る</button><div id="composeOut" class="result"></div></div>
<div class="card"><h2>🎤 メロディ</h2><select id="melodyType"></select><button id="melodyBtn">見る</button><div id="melodyOut" class="result"></div></div>
<div class="card"><h2>🎸 アレンジ</h2><select id="arrangeType"></select><button id="arrangeBtn">見る</button><div id="arrangeOut" class="result"></div></div>
</section>

<section id="mod" class="page">
<div class="card"><h2>↔️ 転調支援</h2><div class="row"><select id="fromKey"></select><select id="toKey"></select></div><button id="modBtn">候補を探す</button><div id="modOut" class="result"></div></div>
</section>

<section id="search" class="page">
<div class="card"><h2>🔎 全データ検索</h2><input id="globalQ" placeholder="コード、進行、転調、J-POPなど"><button id="globalBtn">検索</button><div id="globalOut" class="result"></div></div>
</section>
</main>
<nav>
<button data-page="home">🏠<br>ホーム</button><button data-page="chord">🎹<br>コード</button><button data-page="progress">🔄<br>進行</button><button data-page="scale">🎼<br>スケール</button><button data-page="compose">✍️<br>作曲</button><button data-page="search">🔎<br>検索</button>
</nav>
<script src="./db.js"></script>
<script src="./app.js"></script>
</body></html>
